[general]
default_profile = "home-nas"
theme = "auto"                  # "auto" (follow OS), "dark", or "light"
sidebar_visible = true          # camera sidebar shown at startup
timeline_visible = true         # Live View timeline strip shown at startup
dismissed_update_version = ""   # release tag whose update notice was dismissed
poll_interval_cameras = 30      # seconds, minimum 5; also how often a lost stream is retried
poll_interval_alerts = 30
poll_interval_homemode = 60
poll_interval_transactions = 5  # POS receipts for the Live View overlay
snapshot_dir = "/home/user/.local/share/surveillance-station/snapshots"  # folder the Save dialog opens in

[session]
grid_layout = "2x2"            # "1x1", "2x2", "3x3", or "4x4"
last_page = "live"             # last active page

# Recording search filters (persisted from last search); the cameras
# picked for them are kept per profile, see below
search_from_time = "2026-02-01T00:00:00"
search_to_time = "2026-02-19T23:59:59"
search_time_preset = "today"  # "today", "yesterday", "last24h", "last7d", "last30d", or ""

[setting_overrides]
# Settings page tuning, numeric values (see the Settings page itself for
# what each one does). Present only for settings actually changed from
# their default; use the page's own reset button to remove one.
cache_seconds_default = 1.0
demuxer_max_bytes_mib = 64.0

[setting_overrides_bool]
# Same, for the Settings page's on/off toggles.
osd_enabled = true
force_legacy_events = true  # pre-9.3 event decoding, from the next login

[setting_overrides_choice]
# Same, for the Settings page's dropdowns.
live_view_stream_profile = "low"  # camera (default), high, balanced, low

[profiles.home-nas]
host = "192.168.1.100"
port = 5001
https = true
verify_ssl = false
# Everything keyed by camera ID lives under the profile it belongs to,
# since every NAS numbers its cameras from 1.
search_camera_ids = [1, 3]   # cameras of the last recording search

[profiles.home-nas.layout_cameras]
# Camera IDs per layout (0 = empty slot).  Each layout remembers its
# own assignment independently.
"1x1" = [1]
"2x2" = [1, 3, 0, 5]
"3x3" = [1, 3, 7, 0, 5, 8, 2, 0, 0]

[profiles.home-nas.camera_overrides]
# Direct RTSP URLs keyed by camera ID.
# Use when Synology's RTSP proxy corrupts a stream (e.g. Reolink Duo 3 PoE h265).
5 = "rtsp://admin:password@192.168.1.50:554/h265Preview_01_main"

[profiles.home-nas.camera_volume]
# Live View volume per camera ID, 0-100. Set from the slot's hover toolbar.
5 = 40

[profiles.home-nas.camera_muted]
# Live View mute state per camera ID. Cameras start muted.
5 = false

[profiles.home-nas.legacy_event_type_history]
# Event types each camera has ever produced before Surveillance Station
# 9.3, discovered by the Live View timeline's "Filter events" popover and
# kept so a later open only has to scan forward from checked_until
# instead of the whole history again.
# Written automatically; delete a camera's entry to force a full rescan.
# Also read under its old name, event_type_history; saving writes only
# legacy_event_type_history.
[profiles.home-nas.legacy_event_type_history.5]
types = [[3, 0], [33554435, 2]]  # (event type flag, reserved) pairs
checked_until = 1771200000       # unix time this camera was scanned up to

[profiles.home-nas.camera_protocols]
# Stream protocol per camera ID:
# auto, websocket, mjpeg, rtsp_over_http, rtsp, multicast, direct
# "auto" is the same as "websocket"; there is no fallback between
# protocols, so pick one explicitly if WebSocket does not work.
# "websocket" uses a WebSocket stream bridged to mpv via an in-memory pipe,
# muxing in real audio via ffmpeg when the camera's audio codec is PCMU or AAC.
# "direct" uses the URL from camera_overrides.
5 = "direct"

[profiles.home-nas.camera_live_view_stream_profiles]
# Live View stream profile per camera ID, for WebSocket streams: high,
# balanced, low. A camera with no entry follows its Live View setting in
# Surveillance Station. See "Live View stream profile" below for how this
# combines with the Settings page.
5 = "high"

[profiles.home-nas.camera_dewarp]
# Fisheye dewarp per camera ID: panorama or ptz. A camera with no
# entry is shown as delivered.
5 = "ptz"

[profiles.home-nas.camera_fisheye_lens]
# Lens calibration per camera ID, only when the default (a centred full
# circle of 180 degrees) does not fit: "center_x,center_y,radius,fov".
# Set from Camera Settings with Calibrate… and Apply.
# center_x and center_y are fractions of the frame width and height,
# radius a fraction of its height, fov the lens's field of view in
# degrees. A missing or invalid field keeps its default.
5 = "0.5,0.5,0.48,180"

[profiles.home-nas.camera_fisheye_mount]
# How a dewarped fisheye hangs, per camera ID: "wall" for a lens looking
# straight out. A camera with no entry is on a ceiling, looking down.
5 = "wall"
