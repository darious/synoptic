[package]
name = "ss-ui"
description = "GTK4 desktop UI implementing design/handoff (Surveillance Station Client redesign)"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "surveillance"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_18"] }
glib = "0.21"
gio = "0.21"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
ss-api = { path = "../ss-api" }
ss-stream = { path = "../ss-stream" }
ss-config = { path = "../ss-config" }
