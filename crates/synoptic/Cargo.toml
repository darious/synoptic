[package]
name = "synoptic"
description = "Synoptic — GTK4 desktop client for Synology Surveillance Station"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "synoptic"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_18"] }
glib = "0.21"
gio = "0.21"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
ss-api = { path = "../ss-api" }
ss-stream = { path = "../ss-stream" }
ss-config = { path = "../ss-config" }

[build-dependencies]
glib-build-tools = "0.21"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# registers the bundled IBM Plex fonts with fontconfig (src/fonts.rs)
yeslogic-fontconfig-sys = "6"
