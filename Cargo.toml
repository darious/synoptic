[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "BSD-2-Clause"
rust-version = "1.85"
repository = "https://github.com/darious/synoptic"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs", "net"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
url = "2"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "stream", "http2"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
# dev
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3"
